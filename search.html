<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PHC Search</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


<style>

.page{

min-height:100vh;
background:#eef2f7;
padding:20px;

}


.header{

font-size:20px;
font-weight:800;
color:#004b87;
margin-bottom:20px;

}



.search-box{

background:white;
padding:15px;
border-radius:20px;
display:flex;
align-items:center;
gap:10px;
box-shadow:0 10px 25px rgba(0,0,0,.08);

}



.search-box input{

width:100%;
border:none;
outline:none;
font-size:16px;

}



.result{

margin-top:20px;

}



.user-card{

background:white;
padding:15px;
border-radius:18px;
margin-bottom:12px;
display:flex;
align-items:center;
gap:15px;

}



.avatar{

width:50px;
height:50px;
border-radius:50%;
background:#004b87;
color:white;
display:flex;
align-items:center;
justify-content:center;

}



.empty{

background:white;
padding:20px;
border-radius:20px;
text-align:center;
color:#777;

}


</style>

</head>


<body>


<div class="page">


<div class="header" onclick="history.back()">

<i class="fas fa-arrow-left"></i>

Search

</div>





<div class="search-box">

<i class="fas fa-search"></i>

<input 
id="searchInput"
placeholder="Search users..."
onkeyup="searchUsers()">


</div>





<div class="result" id="results">


<div class="empty">

Search PHC users

</div>


</div>




</div>



<script src="search.js"></script>


</body>

</html>
