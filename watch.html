<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PHC Watch</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


<style>

.page{

min-height:100vh;
background:#eef2f7;
padding:20px;

}


.header{

font-size:20px;
font-weight:800;
color:#004b87;
margin-bottom:20px;

}



.video-card{

background:white;
border-radius:25px;
overflow:hidden;
margin-bottom:18px;
box-shadow:0 10px 25px rgba(0,0,0,.08);

}



.video{

height:180px;
background:#001d3d;
display:flex;
align-items:center;
justify-content:center;
color:white;
font-size:50px;

}



.video-info{

padding:18px;

}



.video-info h3{

margin-bottom:8px;

}



.play-btn{

width:100%;
border:none;
padding:14px;
border-radius:25px;
background:#004b87;
color:white;
font-weight:700;

}


</style>


</head>



<body>


<div class="page">



<div class="header" onclick="history.back()">

<i class="fas fa-arrow-left"></i>

Watch

</div>





<div id="videos">



<div class="video-card">


<div class="video">

<i class="fas fa-play-circle"></i>

</div>



<div class="video-info">


<h3>

PHC Jackpot News

</h3>


<p>

Latest updates and rewards

</p>


<br>


<button class="play-btn"
onclick="playVideo()">

Watch Now

</button>



</div>


</div>





<div class="video-card">


<div class="video">

<i class="fas fa-play-circle"></i>

</div>



<div class="video-info">


<h3>

Winning Tips

</h3>


<p>

Learn how to use PHC features

</p>


<button class="play-btn"
onclick="playVideo()">

Watch Now

</button>


</div>


</div>



</div>




</div>




<script src="watch.js"></script>


</body>

</html>
