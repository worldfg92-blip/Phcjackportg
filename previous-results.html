        // ==========================================================

        let currentRound = realMatches[0];

        // ==========================================================
        // HELPERS
        // ==========================================================
        function formatCurrency(val) {
            return val.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        }

        function formatLargeCurrency(val) {
            if (val >= 1000000000) {
                return (val / 1000000000).toFixed(1) + ' Billion';
            } else if (val >= 1000000) {
                return (val / 1000000).toFixed(0) + ' Million';
            } else {
                return '$' + formatCurrency(val);
            }
        }

        function showToast(msg, duration = 3000) {
            const toast = document.getElementById('toast');
            if (!toast) return;
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => toast.classList.remove('show'), duration);
        }

        function getResultBadgeClass(result) {
            if (result === '1') return 'home-win';
            if (result === 'X') return 'draw';
            if (result === '2') return 'away-win';
            return '';
        }

        function getResultLabel(result) {
            if (result === '1') return '1';
            if (result === 'X') return 'X';
            if (result === '2') return '2';
            return result;
        }

        function getCardIcon(cardType) {
            const icons = {
                'apple': '🍎',
                'razer': '⚡',
                'steam': '🎮'
            };
            return icons[cardType] || '🏆';
        }

        function getCardName(cardType) {
            const names = {
                'apple': 'Apple Card',
                'razer': 'Razer Gold',
                'steam': 'Steam Card'
            };
            return names[cardType] || 'Card';
        }

        function getCardPrize(cardType) {
            if (cardType === 'all') {
                return allCardsPrize;
            }
            return prizeStructure[cardType] || prizeStructure['apple'];
        }

        // ==========================================================
        // FILTER BY CARD
        // ==========================================================
        function filterByCard(cardType) {
            currentFilter = cardType;
            
            document.querySelectorAll('.card-filter-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.card === cardType) {
                    btn.classList.add('active');
                }
            });

            // Update jackpot display
            if (cardType === 'all') {
                document.getElementById('jackpotDisplay').textContent = 'Up to 12.5 Billion';
            } else {
                const cardData = prizeStructure[cardType];
                document.getElementById('jackpotDisplay').textContent = `Up to ${cardData.jackpot}`;
            }

            const filteredRounds = realMatches.filter(round => {
                if (cardType === 'all') return true;
                return round.cardType === cardType;
            });

            if (filteredRounds.length > 0) {
                currentRound = filteredRounds[0];
                renderDropdown(filteredRounds);
                renderResults(currentRound);
                document.getElementById('selectedRound').textContent = `Round ${currentRound.round_number}`;
                document.getElementById('selectedLeague').textContent = currentRound.league;
            } else {
                document.getElementById('resultsContent').innerHTML = `
                    <div class="no-results">
                        <i class="fas fa-search"></i>
                        <h3>No Results Found</h3>
                        <p>No rounds available for ${getCardName(cardType)}</p>
                    </div>
                `;
                document.getElementById('selectedRound').textContent = 'No rounds';
                document.getElementById('selectedLeague').textContent = '—';
            }
        }

        // ==========================================================
        // RENDER DROPDOWN
        // ==========================================================
        function renderDropdown(filteredRounds = null) {
            const container = document.getElementById('roundDropdown');
            container.innerHTML = '';

            const rounds = filteredRounds || realMatches;
            const sortedRounds = [...rounds].sort((a, b) => b.id - a.id);

            if (sortedRounds.length === 0) {
                container.innerHTML = `
                    <div style="padding: 20px; text-align: center; color: #7a8a9a;">
                        No rounds available
                    </div>
                `;
                return;
            }

            sortedRounds.forEach(round => {
                const option = document.createElement('div');
                option.className = 'round-option';
                if (round.id === currentRound.id) {
                    option.classList.add('active-option');
                }
                const cardIcon = getCardIcon(round.cardType);
                option.innerHTML = `
                    <span class="r-number">${cardIcon} Round ${round.round_number}</span>
                    <span class="r-date">${round.draw_date} • ${round.league}</span>
                `;
                option.onclick = function() {
                    selectRound(round);
                };
                container.appendChild(option);
            });
        }

        // ==========================================================
        // SELECT ROUND
        // ==========================================================
        function selectRound(round) {
            currentRound = round;
            document.getElementById('selectedRound').textContent = `Round ${round.round_number}`;
            document.getElementById('selectedLeague').textContent = round.league;
            closeDropdown();
            renderDropdown();
            renderResults(round);
        }

        // ==========================================================
        // TOGGLE DROPDOWN
        // ==========================================================
        function toggleDropdown() {
            const dropdown = document.getElementById('roundDropdown');
            const arrow = document.getElementById('dropdownArrow');

            if (isDropdownOpen) {
                closeDropdown();
            } else {
                openDropdown();
            }
        }

        function openDropdown() {
            const dropdown = document.getElementById('roundDropdown');
            const arrow = document.getElementById('dropdownArrow');
            dropdown.classList.add('open');
            arrow.className = 'fas fa-chevron-up';
            isDropdownOpen = true;
        }

        function closeDropdown() {
            const dropdown = document.getElementById('roundDropdown');
            const arrow = document.getElementById('dropdownArrow');
            dropdown.classList.remove('open');
            arrow.className = 'fas fa-chevron-down';
            isDropdownOpen = false;
        }

        // ==========================================================
        // RENDER RESULTS WITH DYNAMIC PRIZES
        // ==========================================================

            const cardType = round.cardType || 'apple';

            const prize11 = prizes.prize11;

                <div class="match-results">
                    <h3 style="font-size: 16px; margin-bottom: 8px; color: #0a1a2a;">
                        📋 Match Results - ${round.draw_date}
                    </h3>
                    <div class="match-header">
                        <span>#</span>
                        <span>Match</span>
                        <span style="text-align: center;">Score</span>
                        <span style="text-align: center;">Result</span>
                        <span style="text-align: center;"></span>
                    </div>
            `;

            if (round.matches && round.matches.length > 0) {
                round.matches.forEach(match => {
                    const badgeClass = getResultBadgeClass(match.result);
                    const resultLabel = getResultLabel(match.result);
                    html += `
                        <div class="match-result-item">
                            <span class="match-number">${match.match_number}</span>
                            <div class="match-details">
                                <div class="teams">${match.home}<br><span style="font-size:12px; color:#7a8a9a;">vs</span><br>${match.away}</div>
                                <div class="match-date">${match.date}</div>
                            </div>
                            <div class="match-score">${match.home_score} - ${match.away_score}</div>
                            <span class="result-badge ${badgeClass}" style="justify-self: center;">${resultLabel}</span>
                            <span style="font-size:12px; color:#7a8a9a; text-align:center;"></span>
                        </div>
                    `;
                });
            } else {
                html += `
                    <div class="no-results">
                        <i class="fas fa-futbol"></i>
                        <p>No matches available for this round.</p>
                    </div>
                `;
            }

            html += `</div>`;
            container.innerHTML = html;
        }

        // ==========================================================
        // INIT
        // ==========================================================
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('jackpotDisplay').textContent = 'Up to 12.5 Billion';
            renderDropdown();
            renderResults(currentRound);
            console.log('📊 Previous Results loaded with dynamic card-specific prizes!');
            console.log('🍎 Apple: 12/12=$4.5M, 11/12=$9K, 10/12=$15K');
            console.log('⚡ Razer: 12/12=$6M, 11/12=$12K, 10/12=$20K');
            console.log('🎮 Steam: 12/12=$2M, 11/12=$4K, 10/12=$6,667');
            console.log('📊 All Cards Combined: 12/12=$12.5M, 11/12=$25K, 10/12=$41,667');
        });

        document.addEventListener('click', function(e) {
            const selector = document.getElementById('roundSelector');
            const dropdown = document.getElementById('roundDropdown');
            if (!selector.contains(e.target) && !dropdown.contains(e.target)) {
                closeDropdown();
            }
        });
    </script>

</body>
</html>
